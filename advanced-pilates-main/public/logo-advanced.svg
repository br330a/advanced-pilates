<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 160" role="img" aria-labelledby="title desc">
  <title id="title">Advanced Studio</title>
  <desc id="desc">Logotipo vetorial do Advanced Studio Pilates e Fisioterapia</desc>
  <defs>
    <style>
      .pilates{font: 500 22px 'Arial', sans-serif; letter-spacing: 14px; fill:#eb6b2b}
      .adv{font: 900 italic 74px 'Arial', sans-serif; fill:#18a8c8}
      .anced{font: 300 74px 'Arial', sans-serif; fill:#5d646c; letter-spacing:-1px}
      .studio{font: italic 34px 'Georgia', 'Times New Roman', serif; fill:#eb6b2b}
      .sub{font: 700 17px 'Arial', sans-serif; letter-spacing: 4px; fill:#6e8594}
      .line{stroke:#18a8c8; stroke-width:3; stroke-linecap:round}
    </style>
  </defs>
  <text x="63" y="27" class="pilates">PILATES</text>
  <g transform="translate(0 0)">
    <text x="18" y="88" class="adv">ADV</text>
    <text x="162" y="88" class="anced">ANCED</text>
    <text x="331" y="112" class="studio">studio</text>
  </g>
  <line x1="22" x2="98" y1="132" y2="132" class="line"/>
  <text x="114" y="138" class="sub">PILATES &amp; FISIOTERAPIA</text>
  <line x1="410" x2="488" y1="132" y2="132" class="line"/>
</svg>
